<!DOCTYPE html>
<html lang="pt-BR">
<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>HealthTech - Login</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <div class="login-page">
        <form class="login-card" onsubmit="return false;">
            <h1 class="login-title">Hospital Vida</h1>
            <p class="login-subtitle">Entre para acessar o sistema.</p>

            <div class="form-group">
                <label for="email">E-mail</label>
                <input type="email" id="email" class="form-control">
            </div>

            <div class="form-group">
                <label for="senha">Senha</label>
                <input type="password" id="senha" class="form-control">
            </div>

            <button type="button" class="btn-login">Entrar</button>
        </form>
    </div>
</body>
</html>
