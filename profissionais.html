<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Profissionais - HealthTrch Chat</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <aside class="sidebar">
        <div class="logo">HealthTech Chat</div>
 
        <nav class="nav">
            <a href="#">Painel</a>
            <a href="#">Pacientes</a>
            <a href="#" class="active">Profissionais</a>
            <a href="#">Consultas</a>
            <a href="#">Internações</a>
            <a href="#">Quartos</a>
            <a href="#">Histórico médico</a>
            <a href="#">Sair</a>
        </nav>
    </aside>
 <main class="main">
        <h1 class="page-title">Profissionais</h1>
        <p class="subtitle">Cadastro e consulta de profissionais.</p>
 
        <div class="toolbar">
            <input type="search" id="busca" class="search" placeholder="Buscar" aria-label="Buscar profissional">
            <button type="button" id="btnNovo" class="btn">Novo profissional</button>
        </div>
 
        <div class="content-grid">
            <section class="card">
                <div class="table-wrap">
                    <table>
                        <thead>
                            <tr>
                                <th>Nome</th>
                                <th>Registro</th>
                                <th>Especialidade</th>
                                <th>Telefone</th>
                                <th></th>
                            </tr>
                        </thead>
                        <tbody id="tabela"></tbody>
                    </table>
                </div>
            </section>
 
            <form class="card" id="form" novalidate>
                <h2 class="form-title" id="tituloForm">Cadastrar profissional</h2>
 
                <div class="form-group">
                    <label for="nome">Nome</label>
                    <input type="text" id="nome" class="form-control" required>
                </div>
 
                <div class="form-group">
                    <label for="registro">Registro profissional</label>
                    <input type="text" id="registro" class="form-control" required>
                </div>
 
                <div class="form-group">
                    <label for="especialidade">Especialidade</label>
                    <input type="text" id="especialidade" class="form-control" required>
                </div>
 
                <div class="form-group">
                    <label for="telefone">Telefone</label>
                    <input type="tel" id="telefone" class="form-control">
                </div>
 
                <div class="form-group">
                    <label for="email">E-mail</label>
                    <input type="email" id="email" class="form-control">
                </div>
 
                <div class="form-actions">
                    <button type="submit" class="btn">Salvar</button>
                    <button type="button" id="btnCancelar" class="btn" style="margin-top: 8px; background-color: #58717a;" hidden>Cancelar edição</button>
                </div>
            </form>
        </div>
    </main>
 
    
</body>
</html>
